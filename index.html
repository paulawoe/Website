<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paula Wörndl – 3D Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --light:#F2F3F5; --light-ink:#15171B; --light-mute:#7A7F89; --light-accent:#2F54FF;
  --dark:#101114; --dark-ink:#ECEDEF; --dark-mute:#7F8590; --dark-accent:#7C9BFF;
  --ease:cubic-bezier(.65,0,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--dark);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--light-accent);outline-offset:-4px}

/* header */
.bar{position:fixed;z-index:10;top:env(safe-area-inset-top,0px);left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:16px;padding:22px clamp(16px,2.2vw,32px);color:#fff;mix-blend-mode:difference;pointer-events:none;font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.35;font-weight:500;text-transform:uppercase;letter-spacing:.02em}
.bar.foot{top:auto;bottom:env(safe-area-inset-bottom,0px)}
.bar nav{display:flex;gap:clamp(14px,2vw,32px);justify-self:end}
.bar .r{display:flex;justify-content:space-between;gap:24px}
.bar a{pointer-events:auto;color:inherit;text-decoration:none}
.bar nav a.on{text-decoration:underline;text-underline-offset:4px}
.ft{max-width:26ch}
.is-home .bk{visibility:hidden}

/* home: two chapters, split by a vertical line */
#home{display:flex;height:100%}
.half{position:relative;flex:1 1 0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;transition:flex .7s var(--ease)}
.half:hover,.half:focus-visible{flex-grow:1.25}
.half.a{background:var(--light);color:var(--light-ink)}
.half.b{background:var(--dark);color:var(--dark-ink)}
.half .txt{position:relative;z-index:1}
.half h2{margin:0;font-weight:500;font-size:clamp(40px,6vw,100px);line-height:.95;letter-spacing:-.03em}
.half p{margin:18px auto 0;font-size:16px;max-width:30ch;color:var(--light-mute)}
.half.b p{color:var(--dark-mute)}
.half .go{margin-top:28px;font-size:15px;font-weight:500;display:inline-flex;gap:10px;align-items:center}
.half.a .go{color:var(--light-accent)} .half.b .go{color:var(--dark-accent)}
.half .go i{display:inline-block;width:28px;height:1px;background:currentColor;transition:width .5s var(--ease)}
.half:hover .go i{width:56px}
/* background "image": blurred, sharp on hover */
.stage{position:absolute;inset:-5%;display:grid;place-items:center;filter:blur(30px);transform:scale(1.08);transition:filter .8s var(--ease),transform .8s var(--ease)}
.half:hover .stage,.half:focus-visible .stage{filter:blur(0);transform:scale(1)}
@media (hover:none){.stage{filter:blur(10px)}}

.blob{width:min(34vmin,320px);aspect-ratio:1;background:var(--light-ink);animation:morph 9s ease-in-out infinite,spin 24s linear infinite}
.stage .blob{width:min(60vmin,560px);background:#CFD3DB}
@keyframes morph{0%,100%{border-radius:50%}25%{border-radius:12% 88% 30% 70%/60% 30% 70% 40%}50%{border-radius:8%}75%{border-radius:70% 30% 60% 40%/30% 70% 30% 70%}}
@keyframes spin{to{transform:rotate(360deg)}}

.scene{--z:min(11vmin,100px);width:min(22vmin,200px);aspect-ratio:1;perspective:900px}
.stage .scene{--z:min(18vmin,170px);width:min(36vmin,340px)}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cube 16s linear infinite}
.cube span{position:absolute;inset:0;border:1px solid var(--dark-accent);background:rgba(124,155,255,.08)}
.cube span:nth-child(1){transform:translateZ(var(--z))}.cube span:nth-child(2){transform:rotateY(180deg) translateZ(var(--z))}
.cube span:nth-child(3){transform:rotateY(90deg) translateZ(var(--z))}.cube span:nth-child(4){transform:rotateY(-90deg) translateZ(var(--z))}
.cube span:nth-child(5){transform:rotateX(90deg) translateZ(var(--z))}.cube span:nth-child(6){transform:rotateX(-90deg) translateZ(var(--z))}
@keyframes cube{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}

/* detail views */
.detail{min-height:100%;padding:112px clamp(20px,3vw,44px) 64px}
.detail[hidden]{display:none}
.detail.a{background:var(--light);color:var(--light-ink)}
.detail.b{background:var(--dark);color:var(--dark-ink)}
.back{font-size:15px;font-weight:500;margin-bottom:40px;display:block}
.detail.a .back{color:var(--light-accent)} .detail.b .back{color:var(--dark-accent)}
.detail h1{margin:0 0 48px;font-weight:500;font-size:clamp(40px,6vw,88px);letter-spacing:-.03em;line-height:1}
.txtp{max-width:44ch;line-height:1.5;margin:0 0 1em}
.grid{display:grid;gap:clamp(12px,1.6vw,24px);grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.tile{position:relative;overflow:hidden;display:grid;place-items:center;border-radius:4px;aspect-ratio:1;background:#191B20}
.tile .t{position:absolute;left:16px;bottom:14px;font-size:14px;color:var(--dark-mute)}
.tile .scene{--z:min(5vmin,44px);width:min(10vmin,88px)}
.tile{cursor:grab}
.tile model-viewer{position:absolute;inset:0;width:100%;height:100%;background:#191B20;--poster-color:#191B20}
.tile .more{position:absolute;right:14px;bottom:10px;font-size:13px;font-weight:500;color:var(--dark-accent);padding:4px 0;border-bottom:1px solid currentColor;cursor:pointer}
.tile .t{pointer-events:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile:hover .t{color:var(--dark-ink)}
/* 3D-Viewer-Seite */
.am{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:clamp(24px,4vw,72px);align-items:start}
.am .v{aspect-ratio:4/3;background:#191B20;border-radius:4px;overflow:hidden}
.am .v model-viewer,.am .v img{display:block;width:100%;height:100%;object-fit:contain;background:transparent;--poster-color:transparent}
.am h1{font-size:clamp(32px,4vw,56px);margin-bottom:24px}
.am p{color:var(--dark-mute);max-width:40ch;line-height:1.5;margin:0}
.btn{display:inline-block;margin-top:28px;padding:12px 20px;border:1px solid var(--dark-accent);color:var(--dark-accent);text-decoration:none;font-weight:500;border-radius:2px;transition:background .3s,color .3s}
.btn:hover{background:var(--dark-accent);color:var(--dark)}

/* carousel (A) */
.detail.carousel{height:100%;min-height:0;padding:0;overflow:hidden;position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.item .blob{background:var(--light-ink);width:40%}
.item .media video,.item .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cstage{position:absolute;inset:0;overflow:hidden}
#track{position:absolute;left:0;top:0;height:0;will-change:transform}
.item{position:absolute;top:0;cursor:pointer}
.item .media{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center}
.cap{position:absolute;left:0;bottom:100%;margin-bottom:18px;font-size:14px;line-height:1.4;pointer-events:none;white-space:nowrap}
.cap i{display:block;font-style:normal;margin-bottom:26px}
.cap b{display:block;font-weight:500}
.cap span{display:block;color:var(--light-mute)}
.hint{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:14px;color:var(--light-mute);white-space:nowrap}
/* project page */
.pj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(24px,4vw,72px);align-items:start}
.pj dl{margin:0 0 32px;display:grid;gap:14px}
.pj dt{font-size:14px;color:var(--light-mute)}
.pj dd{margin:2px 0 0}
.pm{aspect-ratio:16/9;background:#DFE2E7;display:grid;place-items:center;overflow:hidden;margin-bottom:clamp(12px,1.6vw,24px)}
.pm .blob{width:22%;background:var(--light-ink)}
.pm{position:relative}
.pm video,.pm img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

@media (max-width:760px){
  #home{flex-direction:column}
  .half:hover,.half:focus-visible{flex-grow:1}
  .half p{display:none}
  .bar{grid-template-columns:1fr auto;row-gap:8px;font-size:11px}
  .bar nav{grid-column:1/-1;justify-self:start;gap:14px;order:3}
  .bar .r{display:none}
  .pj,.am{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>

<header class="bar">
  <a href="#" data-go="home">Paula Wörndl</a>
  <a href="#" class="bk">(Zurück)</a>
  <nav>
    <a href="#" data-go="a">3D Motion Design</a>
    <a href="#" data-go="b">Gaming Assets</a>
    <a href="#" data-go="about">About</a>
  </nav>
</header>

<footer class="bar foot">
  <a href="#" data-go="home">Paula Wörndl</a>
  <a href="#" class="bk">(Zurück)</a>
  <div class="r">
    <div class="ft" id="ft"></div>
    <nav>
      <a href="#" data-go="a">3D Motion Design</a>
      <a href="#" data-go="b">Gaming Assets</a>
      <a href="#" data-go="about">About</a>
    </nav>
  </div>
</footer>

<main id="home">
  <button class="half a" data-open="a" aria-label="3D Motion Design öffnen">
   <div class="stage"><video src="videos/Amore_2.mp4" autoplay muted loop playsinline></video></div>
    <div class="txt"><h2>3D Motion<br>Design</h2><p>CGI Motion Design.</p><span class="go">Ansehen <i></i></span></div>
  </button>
  <button class="half b" data-open="b" aria-label="Gaming Assets öffnen">
    <div class="stage"><video src="videos/FAECHER_01_2.mp4" autoplay muted loop playsinline></video></div>
    <div class="txt"><h2>Gaming<br>Assets</h2><p>Modelle, Props und Environments.</p><span class="go">Ansehen <i></i></span></div>
  </button>
</main>

<section class="detail a carousel" id="view-a" hidden>
  <div class="cstage"><div id="track"></div></div>
  <div class="hint">Scrollen oder wischen, Klick öffnet das Projekt</div>
</section>

<section class="detail a" id="view-p" hidden>
  <div id="pj"></div>
</section>

<section class="detail b" id="view-b" hidden>
  <h1>Gaming Assets</h1>
  <div class="grid" id="grid-b"></div>
</section>

<section class="detail b" id="view-m" hidden>
  <div id="mv"></div>
</section>

<section class="detail a" id="view-about" hidden>
  <h1>About</h1>
  <p class="txtp">Platzhalter: Ein paar Sätze über dich, deine Arbeit und woran du gerade arbeitest.</p>
  <p class="txtp">hallo@example.com</p>
</section>

<script>
  const home = document.getElementById('home');
  const views = { a: document.getElementById('view-a'), b: document.getElementById('view-b'), p: document.getElementById('view-p'), about: document.getElementById('view-about'), m: document.getElementById('view-m') };
  const cube = '<div class="scene"><div class="cube"><span></span><span></span><span></span><span></span><span></span><span></span></div></div>';
  /* ===== HIER DEINE ASSETS EINTRAGEN (Gaming Assets) =====
     Pro Zeile: [Titel, Beschreibung, 'models/datei.glb', 'models/still.png', 'https://link-zum-kaufen' (optional)]
     - 3. Feld: das 3D-Modell (.glb). Leer lassen ('') für ein Asset nur mit Still.
     - 4. Feld: das Vorschaubild für die Kachel (png, jpg, webp).
     - 5. Feld (optional): Link zu Fab, Gumroad usw. Ohne Link gibt es einen direkten .glb-Download. */
  const assets = [
    ['Cat statue','Kurzbeschreibung des Assets.','models/cat.glb',''],
    ['Blabla','Kurzbeschreibung des Assets.','models/asset-02.glb','models/asset-02.png'],
    ['XX','Nur Still, ohne 3D-Modell.','','models/asset-03.png']
  ];
  document.getElementById('grid-b').innerHTML = assets.map((a,i) =>
    `<div class="tile" data-i="${i}">${!a[2] && !a[3] ? cube : ''}${a[2] ? `<model-viewer src="${a[2]}" ${a[3] ? `poster="${a[3]}"` : ''} alt="${a[0]}" loading="lazy" reveal="auto" camera-controls disable-zoom auto-rotate-delay="0" touch-action="pan-y" shadow-intensity="1" environment-image="neutral" exposure="1.1" interaction-prompt="none"></model-viewer>` : (a[3] ? `<img src="${a[3]}" alt="${a[0]}" onerror="this.remove()">` : '')}<span class="t">${a[0]}</span><button class="more" data-more="${i}">Details</button></div>`).join('');
  const gb = document.getElementById('grid-b');
  gb.addEventListener('click', e => {
    const b = e.target.closest('[data-more]'), t = e.target.closest('.tile');
    if (b) openAsset(+b.dataset.more);
    else if (t && !t.querySelector('model-viewer')) openAsset(+t.dataset.i);
  });
  /* Modell dreht sich nur beim Hover (schont den Rechner) */
  gb.addEventListener('mouseover', e => { const t = e.target.closest('.tile'), mv = t && t.querySelector('model-viewer'); if (mv) mv.autoRotate = true; });
  gb.addEventListener('mouseout', e => { const t = e.target.closest('.tile'); if (t && !t.contains(e.relatedTarget)) { const mv = t.querySelector('model-viewer'); if (mv) mv.autoRotate = false; } });
  
  function openAsset(i){
    const a = assets[i];
    const view = a[2]
      ? `<model-viewer src="${a[2]}" alt="${a[0]}" camera-controls auto-rotate auto-rotate-delay="1500" shadow-intensity="1" environment-image="neutral" exposure="1.1" interaction-prompt="none"></model-viewer>`
      : `<img src="${a[3] || ''}" alt="${a[0]}">`;
    const btn = a[4] ? `<a class="btn" href="${a[4]}" target="_blank" rel="noopener">Download / Kaufen</a>`
      : (a[2] ? `<a class="btn" href="${a[2]}" download>Download (.glb)</a>` : '');
    document.getElementById('mv').innerHTML = `<div class="am"><div class="v">${view}</div><div><h1>${a[0]}</h1><p>${a[1]}</p>${btn}</div></div>`;
    show('m'); setFt(a[1]);
  }

  function show(key){
    home.style.display = key ? 'none' : '';
    Object.entries(views).forEach(([k,el]) => el.hidden = k !== key);
    document.body.style.background = (key && key !== 'b' && key !== 'm') ? 'var(--light)' : 'var(--dark)';
    document.querySelectorAll('.bar nav a').forEach(a => a.classList.toggle('on', a.dataset.go === ({p:'a', m:'b'}[key] || key)));
    window.scrollTo(0,0);
    cur = key; document.body.classList.toggle('is-home', !key);
    setFt((key === 'a' || key === 'p') ? projects[Math.max(activeP,0)] : null);
    if (key === 'a') startCarousel(); else stopCarousel();
  }
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => show(b.dataset.open)));
  document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(a.dataset.go === 'home' ? null : a.dataset.go); }));
  document.querySelectorAll('[data-to]').forEach(b => b.addEventListener('click', () => show(b.dataset.to)));
  let cur = null;
  const ftEl = document.getElementById('ft');
  const setFt = p => { ftEl.innerHTML = p ? p[1] : 'Portfolio 2026<br>3D Motion Design &amp; Gaming Assets'; };
  document.body.classList.add('is-home'); setFt(null);
  document.querySelectorAll('.bk').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(cur === 'p' ? 'a' : cur === 'm' ? 'b' : null); }));

  /* ---------- Carousel A: endlos, aktives Projekt doppelt so groß, großes Bild im Hintergrund ---------- */
  /* ===== HIER DEINE PROJEKTE EINTRAGEN =====
     Pro Zeile: [Titel, Beschreibung, 'videos/datei.mp4', 'videos/datei-full.mp4' (optional)]
     Das 3. Feld ist das Video für das Karussell, das 4. (optional) die größere Version für die Projektseite.
     Fehlt eine Datei, bleibt automatisch der Platzhalter sichtbar. */
  const projects = [
    ['Augmented Emotions','AR project','videos/Angst.png'],
    ['Hold me tight','private project','videos/purple.mp4'],
    ['HÖR Berlin','March Artwork for HÖR Berlin','videos/Hoer.png'],
    ['300.000 Volt','Von nun an jagt die Beute','videos/WURFSTERN_2.mp4'],
    ['Sucux Coffee','Sucux Coffee Animations','videos/Sucux_Archive_sale_2.mp4'],
    ['Diesel X Ultrahuman','Animation Diesel X Ultrahuman','videos/Diesel_UH.mp4'],
    ['Amore AG','Artwork for Amore AG','videos/Amore_2.mp4']
  ];
  const n = projects.length, reps = 5;
  /* Bilder (png, jpg, webp, gif) und Videos (mp4) werden automatisch erkannt */
  const isImg = f => /\.(png|jpe?g|webp|gif|avif)$/i.test(f || '');
  const mediaTag = (f, mode) => !f ? '' : isImg(f)
    ? `<img src="${f}" alt="" draggable="false" onerror="this.remove()">`
    : mode === 'tile'
      ? `<video src="${f}#t=0.1" muted loop playsinline preload="metadata" onerror="this.remove()"></video>`
      : `<video src="${f}" autoplay muted loop playsinline controls onerror="this.remove()"></video>`;
  const tint = (i,l) => `hsl(${215+(i%n)*14} 12% ${l}%)`;
  const track = document.getElementById('track'), vA = views.a;
  track.innerHTML = Array.from({length:n*reps},(_,i) =>
    `<div class="item" data-i="${i}" role="button" tabindex="0"><div class="media" style="background:${tint(i,89)}"><div class="blob" style="animation-delay:-${(i%n)*1.3}s,0s"></div>${mediaTag(projects[i%n][2], 'tile')}</div><div class="cap"><i>${String(i%n+1).padStart(2,'0')}.</i><b>${projects[i%n][0]}</b><span>[3D ANIMATION]</span></div></div>`).join('');
  const items = [...track.children];
  /* Videos nur abspielen, solange sie im Bild sind (schont Rechner und Handy) */
  const io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector('video'); if (!v) return;
    if (e.isIntersecting) v.play().catch(() => {}); else v.pause();
  }));
  items.forEach(el => io.observe(el));
  let pos = 2*n, target = 2*n, raf = 0, dims, dragX = null, moved = 0, snapT, activeP = -1;

  function measure(){
    const w = innerWidth, h = innerHeight;
    const R = 1320/1080; /* Kachelformat 1080x1320: alle Videos werden darauf zugeschnitten */
    const bw = Math.min(Math.max(w*.28, 180), 520, h*.52/R);
    dims = { sw: bw/2, bw, sh: bw/2*R, bh: bw*R, gap: 0, top: (h - bw*R)/2 + h*.02 };
  }
  function layout(){
    const { sw,bw,sh,bh,gap,top } = dims; let x = 0; const cx = [];
    items.forEach((el,i) => {
      const d = Math.abs(i-pos), k = Math.max(0,1-d), w = sw+(bw-sw)*k, h = sh+(bh-sh)*k;
      el.style.width = w+'px'; el.style.height = h+'px'; el.style.left = x+'px';
      el.lastElementChild.style.opacity = Math.max(0, 1-d*2.5);
      cx.push(x + w/2); x += w + gap;
    });
    const i0 = Math.floor(pos), c = cx[i0] + (cx[i0+1] - cx[i0]) * (pos-i0);
    track.style.transform = `translate(${innerWidth/2 - c}px,${top}px)`;
    const p = ((Math.round(pos) % n) + n) % n;
    if (p !== activeP){ activeP = p; if (!vA.hidden) setFt(projects[p]); }
  }
  function tick(){
    pos += (target-pos)*.1; if (Math.abs(target-pos) < .0005) pos = target;
    if (pos < 2*n){ pos += n; target += n; } else if (pos >= 3*n){ pos -= n; target -= n; }
    layout(); raf = requestAnimationFrame(tick);
  }
  function startCarousel(){ measure(); cancelAnimationFrame(raf); tick(); }
  function stopCarousel(){ cancelAnimationFrame(raf); }
  addEventListener('resize', () => { if (!vA.hidden) measure(); });

  vA.addEventListener('wheel', e => {
    e.preventDefault();
    const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    target += d/450;
    clearTimeout(snapT); snapT = setTimeout(() => target = Math.round(target), 140);
  }, { passive:false });
  vA.addEventListener('pointerdown', e => { dragX = e.clientX; moved = 0; });
  addEventListener('pointermove', e => {
    if (dragX === null) return;
    const dx = e.clientX - dragX; dragX = e.clientX; moved += Math.abs(dx);
    target -= dx/(dims.sw + dims.gap);
  });
  ['pointerup','pointercancel'].forEach(t => addEventListener(t, () => { if (dragX !== null){ dragX = null; target = Math.round(target); } }));
  addEventListener('keydown', e => {
    if (vA.hidden) return;
    if (e.key === 'ArrowRight') target = Math.round(target)+1;
    if (e.key === 'ArrowLeft') target = Math.round(target)-1;
  });
  items.forEach(el => {
    const go = () => { const i = +el.dataset.i; if (Math.abs(i-pos) < .5) openProject(i % n); else target = i; };
    el.addEventListener('click', () => { if (moved < 6) go(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });

  function openProject(i){
    const p = projects[i];
    document.getElementById('pj').innerHTML =
